<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1920px; height: 1080px; background: #14161A; color: #F7F5EF;
         font-family: "Microsoft YaHei", sans-serif; overflow: hidden; position: relative; }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(to right, rgba(247,245,239,.05) 1px, transparent 1px),
                      linear-gradient(to bottom, rgba(247,245,239,.05) 1px, transparent 1px);
    background-size: 60px 60px; }
  .wrap { position: relative; padding: 150px 140px; }
  .eyebrow { font-family: Consolas, monospace; font-size: 22px; letter-spacing: 6px;
             color: #8FB3C4; text-transform: uppercase; }
  h1 { font-family: Georgia, serif; font-size: 132px; letter-spacing: -3px; margin: 34px 0 10px; }
  .sub { font-size: 40px; color: #CFCABD; font-weight: 300; letter-spacing: 2px; }
  .rule { width: 220px; height: 7px; background: #A63C2A; margin: 46px 0 44px; }
  .meta { font-family: Consolas, monospace; font-size: 22px; color: #8A8578; line-height: 2; }
  .tag { display: inline-block; border: 1px solid #3A3A33; padding: 6px 16px; margin-right: 12px;
         font-family: Consolas, monospace; font-size: 19px; color: #A8A294; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="eyebrow">全国高校 AI 大模型挑战赛 · 省赛作品</div>
    <h1>SciLoom 智研织机</h1>
    <div class="sub">基于大模型与 Agent 架构的全流程科研助手</div>
    <div class="rule"></div>
    <div class="meta">
      <span class="tag">PDF 解析</span>
      <span class="tag">抗幻觉 RAG</span>
      <span class="tag">引用图谱</span>
      <span class="tag">写作 Copilot</span>
      <div style="margin-top:34px">B 组 · 演示视频</div>
    </div>
  </div>
</body>
</html>
