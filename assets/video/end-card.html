<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1920px; height: 1080px; background: #14161A; color: #F7F5EF;
         font-family: "Microsoft YaHei", sans-serif; overflow: hidden; position: relative;
         display: flex; align-items: center; justify-content: center; }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(to right, rgba(247,245,239,.05) 1px, transparent 1px),
                      linear-gradient(to bottom, rgba(247,245,239,.05) 1px, transparent 1px);
    background-size: 60px 60px; }
  .box { position: relative; text-align: center; }
  h1 { font-family: Georgia, serif; font-size: 96px; letter-spacing: -2px; margin-bottom: 28px; }
  .rule { width: 160px; height: 6px; background: #A63C2A; margin: 0 auto 44px; }
  .line { font-size: 34px; color: #CFCABD; font-weight: 300; line-height: 2; }
  .mono { font-family: Consolas, monospace; font-size: 24px; color: #8A8578; margin-top: 46px; line-height: 2; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="box">
    <h1>让每一句结论都可追溯</h1>
    <div class="rule"></div>
    <div class="line">SciLoom 智研织机</div>
    <div class="mono">
      github.com/YankeeLio/ai-research-assistant<br />
      谢谢观看
    </div>
  </div>
</body>
</html>
