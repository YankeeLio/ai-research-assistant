[project]
name = "sciloom-api"
version = "0.1.0"
description = "SciLoom 科研助手 Agent 后端服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pymupdf>=1.24",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
rag = ["chromadb>=0.5", "rank-bm25>=0.2.2", "sentence-transformers>=3.0"]
graph = ["networkx>=3.3"]
viz = ["matplotlib>=3.9", "pandas>=2.2"]
ocr = ["paddleocr>=2.7", "paddlepaddle>=2.6", "pdf2image>=1.17"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
